  <text class="pass-text" x="684" y="736">HighlightPass</text>
  <rect class="tag-editor" x="704" y="746" width="78" height="20" rx="5"/>
  <text class="tag-text-editor" x="716" y="761">EDITOR</text>

  <rect class="target" x="880" y="690" width="244" height="74" rx="12"/>
  <text class="target-text" x="904" y="731">HighlightOutputTexture</text>

  <rect class="pass-editor" x="1224" y="574" width="210" height="74" rx="12"/>
  <text class="pass-text" x="1252" y="620">CompositionPass</text>
  <rect class="tag-editor" x="1288" y="630" width="78" height="20" rx="5"/>
