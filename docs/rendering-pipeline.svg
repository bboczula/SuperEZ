<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowDebug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a16207"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 52px Arial, sans-serif; fill: #0f172a; }
      .lane-title { font: 800 25px Arial, sans-serif; fill: white; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .small { font: 600 16px Arial, sans-serif; fill: #475569; }
      .tiny { font: 700 13px Arial, sans-serif; fill: #334155; }
      .pass { fill: #2563eb; stroke: #1e40af; stroke-width: 3; }
      .pass-editor { fill: #7c3aed; stroke: #5b21b6; stroke-width: 3; stroke-dasharray: 8 6; }
      .pass-debug { fill: #f59e0b; stroke: #b45309; stroke-width: 3; }
      .target { fill: #dcfce7; stroke: #15803d; stroke-width: 3; }
      .target-shadow { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; }
      .target-id { fill: #fef9c3; stroke: #ca8a04; stroke-width: 3; }
      .target-debug { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .pass-text { font: 800 19px Arial, sans-serif; fill: white; }
      .target-text { font: 800 17px Arial, sans-serif; fill: #14532d; }
      .lane-always { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .lane-editor { fill: #faf5ff; stroke: #a855f7; stroke-width: 2; stroke-dasharray: 10 8; }
      .lane-debug { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 4; marker-end: url(#arrow); }
      .flow-thin { fill: none; stroke: #1f2937; stroke-width: 3; marker-end: url(#arrow); }
      .flow-debug { fill: none; stroke: #a16207; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrowDebug); }
      .tag-editor { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .tag-debug { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .tag-text-editor { font: 800 12px Arial, sans-serif; fill: #5b21b6; }
      .tag-text-debug { font: 800 12px Arial, sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1100"/>
  <text class="title" x="44" y="72">SuperEZ Render Graph</text>

  <!-- Legend -->
  <rect x="1020" y="28" width="720" height="78" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect class="pass" x="1044" y="45" width="54" height="44" rx="10"/>
  <text class="pass-text" x="1060" y="75">P</text>
  <text class="label" x="1114" y="74">Render Pass = work</text>
  <rect class="target" x="1364" y="45" width="70" height="44" rx="10"/>
  <text class="target-text" x="1382" y="74">RT</text>
  <text class="label" x="1452" y="74">Render Target / Texture = data</text>

