  <path class="flow-debug" d="M 764 967 L 824 967"/>
  <path class="flow-debug" d="M 1557 318 C 1557 746, 1456 746, 1456 932"/>

  <!-- Current architecture note -->
  <rect x="1048" y="1028" width="686" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="tiny" x="1068" y="1054">Current branch: CompositionPass is editor-only; non-editor BlitPass copies RT_ForwardPass directly to BackBuffer.</text>
</svg>
